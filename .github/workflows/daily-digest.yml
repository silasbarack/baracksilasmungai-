name: Daily sales digest

# Emails the owner the leads that need action today. Runs Monday to Saturday at 06:47 EAT (03:47 UTC);
# GitHub may start scheduled runs a little late. Run it by hand from the Actions tab at any time.
#
# No secret is needed: the job sends GitHub's signed OIDC identity token, and the server accepts only
# tokens issued to this workflow on main of this repository (see verifyDigestOidc in server.js).
on:
  schedule:
    - cron: '47 3 * * 1-6'
  workflow_dispatch:
    inputs:
      force:
        description: 'Send even if a digest already went out today'
        type: boolean
        default: false

permissions:
  id-token: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Send the digest
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://baracksilasmungai.onrender.com' }}
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: |
          # Render's free plan sleeps; the first requests wake it, so retry for up to ~5 minutes.
          for i in 1 2 3 4 5 6; do
            # A fresh token each attempt: they are short-lived.
            TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=baracksilasmungai-digest" | jq -r .value)
            code=$(curl -sS -o body.json -w '%{http_code}' --max-time 90 -X POST \
              -H "Authorization: Bearer $TOKEN" "$SITE_URL/api/digest?force=$FORCE") || code=000
            echo "Attempt $i: HTTP $code $(cat body.json 2>/dev/null)"
            if [ "$code" = 200 ]; then exit 0; fi
            if [ "$code" = 404 ]; then echo "::error::The site refused the token, or is running a version without OIDC support. Check the Render logs for 'Sales digest call refused'."; exit 1; fi
            if [ "$code" = 503 ]; then echo "::error::Email is not configured on the server."; exit 1; fi
            sleep 30
          done
          echo "::error::The site did not answer."; exit 1

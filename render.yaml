services:
  - type: web
    name: baracksilasmungai
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/content
    envVars:
      - key: NODE_ENV
        value: production
      - key: SITE_URL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: baracksilasmungai-db
          property: connectionString
      - key: OWNER_EMAIL
        sync: false
      # Render's free plan blocks outbound SMTP; Resend sends over HTTPS instead.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
databases:
  - name: baracksilasmungai-db
    plan: free
    region: frankfurt
